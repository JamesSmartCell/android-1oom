AutoName: Orion Master
Description: |-
  Orion Master is a native Android port of 1oom. It is the engine only and
  cannot run without a legally owned Master of Orion v1.3 LBX set, which is
  proprietary.

RepoType: git
Repo: https://github.com/JamesSmartCell/android-1oom

Builds:
  - versionName: 1.0.2
    versionCode: 3
    commit: REPLACE_AFTER_PUSH
    timeout: 10800
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    ndk: 27.2.12479018

MaintainerNotes: |-
  Native CMake build of the in-repo 1oom engine (src/) plus Android hw/os/audio
  backends. No prebuilt .so files. NDK is pinned in app/build.gradle.kts to
  27.2.12479018 (r27c). Gradle wrapper 9.5.0 has a distributionSha256Sum.

  The APK does not contain Master of Orion LBX files. Users supply a legally
  owned v1.3 set (including V11.LBX) via the SAF folder picker. No storage
  permission is requested. The app is offline (no INTERNET permission).

  Fastlane metadata lives in the app repo.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.2
CurrentVersionCode: 3
