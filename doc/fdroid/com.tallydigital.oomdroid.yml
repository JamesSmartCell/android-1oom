MaintainerNotes: |-
  Native CMake build of the in-repo 1oom engine (src/) plus Android hw/os/audio
  backends. No prebuilt .so files. NDK is pinned in app/build.gradle.kts to
  27.2.12479018 (r27c). Gradle wrapper 9.5.0 has a distributionSha256Sum.

  The APK does not contain Master of Orion LBX files. Users supply a legally
  owned v1.3 set (including V11.LBX) via the first-run folder picker.

  MANAGE_EXTERNAL_STORAGE is requested so the user can grant all-files access
  before the SAF folder picker. The app is offline (no INTERNET permission).

  Fastlane metadata lives in the upstream repo. After tagging v1.0.0, replace
  this commit: value with the tag (or the exact commit hash CI checked out).

